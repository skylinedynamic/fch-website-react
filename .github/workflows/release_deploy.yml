name: Deploy to Production

on:
  push:
    branches:
      - release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application (Verification)
        run: npm run build

      - name: Create Empty Directory for Sync Bypassing
        run: mkdir -p empty_deploy_dir

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.PROD_SSH_HOST }}
          REMOTE_USER: ${{ secrets.PROD_SSH_USER }}
          SOURCE: "empty_deploy_dir/"
          TARGET: "/tmp/empty_deploy_bypass"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"
          SCRIPT_AFTER: |
            echo "Starting deployment on server..."
            cd /var/www/html/fourcornerfunding
            
            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/release
            
            echo "Installing dependencies..."
            npm ci
            
            echo "Building Next.js app..."
            npm run build
            
            echo "Restarting application..."
            pm2 restart fch-website || pm2 start npm --name "fch-website" -- start
            
            echo "Restarting Nginx..."
            sudo systemctl restart nginx
            
            echo "Deployment successful!"

      - name: Smoke Test
        run: |
          echo "Checking site availability..."
          # Give the application a few seconds to boot up completely
          sleep 5
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://fourcornerfunding.com/)
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Site is LIVE (HTTP 200)"
          else
            echo "❌ Site returned HTTP $RESPONSE"
            exit 1
          fi
