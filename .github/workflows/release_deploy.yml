name: Deploy to Production

on:
  push:
    branches:
      - release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Deploy & Build on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "--- Current User: $(whoami) ---"
            echo "--- Starting deployment on server ---"
            cd /var/www/html/fourcornerfunding
            
            echo "--- Verifying Git Remote ---"
            git remote -v
            
            echo "--- Pulling latest code from origin/release ---"
            # Force update origin in case of stale references
            git fetch --all
            git reset --hard origin/release
            
            echo "--- Checking file update status ---"
            ls -l middleware.ts
            
            echo "--- Installing dependencies ---"
            npm ci
            
            echo "--- Building Next.js app ---"
            npm run build
            
            echo "--- Restarting application (PM2) ---"
            # Ensure pm2 is in the path or use absolute path if needed
            pm2 restart fch-website || pm2 start npm --name "fch-website" -- start
            
            echo "--- Restarting Nginx ---"
            # Only restart if config is valid
            sudo nginx -t && sudo systemctl restart nginx
            
            echo "--- Deployment finished successfully! ---"

      - name: Post-Deployment Smoke Test
        run: |
          echo "Waiting for server to boot..."
          sleep 5
          PROD_URL="https://fourcornerfunding.com/"
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 15 "$PROD_URL" || echo "000")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Smoke test passed! Production responded with HTTP $HTTP_STATUS."
          else
            echo "❌ Smoke test failed! Expected HTTP 200 but received $HTTP_STATUS."
            exit 1
          fi
